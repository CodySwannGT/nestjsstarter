service: your-project
frameworkVersion: '^4.0.0'

# Configuration for serverless-esbuild community plugin (not native Serverless Framework esbuild).
# We use this plugin instead of native esbuild for features like custom plugins (esbuild.plugins.js).
custom:
  # Remove old Lambda versions on deploy so the account doesn't accumulate
  # storage against the 75GB code-storage limit
  prune:
    automatic: true
    number: 3
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    keepNames: true
    platform: node
    target: node20
    plugins: esbuild.plugins.js
    resolveExtensions:
      - '.ts'
      - '.js'
      - '.mjs'
    exclude:
      - '@aws-sdk/*'
      - 'aws-sdk'
      # external-but-not-installed optionals must also be excluded from
      # packaging or serverless-esbuild fails resolving them as prod deps
      - 'fsevents'
      - '@nestjs/websockets'
      - '@nestjs/microservices'
      - '@apollo/gateway'
      - '@apollo/subgraph'
      - '@as-integrations/fastify'
      - 'ts-morph'
      - '@mikro-orm/core'
      - '@mikro-orm/nestjs'
      - '@nestjs/mongoose'
      - '@nestjs/sequelize'
      - 'mongoose'
      - 'sequelize'
      - 'class-transformer/storage'
    # Mark optional peer dependencies as external to prevent bundling errors
    external:
      - 'fsevents'
      - '@nestjs/websockets'
      - '@nestjs/microservices'
      - '@apollo/gateway'
      - '@apollo/subgraph'
      - '@as-integrations/fastify'
      - 'ts-morph'
      # @nestjs/terminus optional ORM health indicators (not installed)
      - '@mikro-orm/core'
      - '@mikro-orm/nestjs'
      - '@nestjs/mongoose'
      - '@nestjs/sequelize'
      - 'mongoose'
      - 'sequelize'
      # optional @nestjs/graphql require, resolved in try/catch at runtime
      - 'class-transformer/storage'
      # native addon (prebuilt .node binary) — cannot be bundled, ship as a
      # runtime node_module instead
      - '@sentry/profiling-node'

plugins:
  - serverless-esbuild
  - serverless-plugin-common-excludes
  - serverless-offline
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  # Operators opt in with AWS_PROFILE; the empty default keeps
  # credential-free local boot (`sls offline start`) and CI working
  profile: ${env:AWS_PROFILE, ''}
  tracing:
    lambda: true
    apiGateway: true
  httpApi:
    # Explicit CORS config required for Sentry SDK headers (sentry-trace,
    # baggage). The default `cors: true` only allows standard headers,
    # causing CORS errors when a frontend sends tracing headers
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
        - sentry-trace
        - baggage
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - HEAD
        - OPTIONS
      maxAge: 86400
  websocketsApiName: ${self:service}-websockets-${sls:stage}
  websocketsApiRouteSelectionExpression: $request.body.type
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - 'execute-api:ManageConnections'
          Resource:
            # Account wildcard (still scoped to ManageConnections on
            # @connections in-region): ${aws:accountId} needs an STS call,
            # which breaks credential-free `sls offline start`
            - 'arn:aws:execute-api:${aws:region}:*:*/@connections/*'
        - Effect: Allow
          Action:
            - 'xray:PutTraceSegments'
            - 'xray:PutTelemetryRecords'
          Resource: '*'
        # Required by src/database/rds-signer.ts (IAM database auth) and
        # secrets-based configuration in production
        - Effect: Allow
          Action: 'rds-db:connect'
          Resource: '*'
        - Effect: Allow
          Action: 'secretsmanager:GetSecretValue'
          Resource: '*'

# Production VPC Configuration for Aurora Serverless v2
# Uncomment and configure when deploying to production
#
# provider:
#   vpc:
#     securityGroupIds:
#       - ${ssm:/your-project/${self:provider.stage}/vpc/security-group-id}
#     subnetIds:
#       - ${ssm:/your-project/${self:provider.stage}/vpc/subnet-id-1}
#       - ${ssm:/your-project/${self:provider.stage}/vpc/subnet-id-2}
#
# Environment Variables for Aurora (add to provider.environment):
#   DATABASE_HOST: ${ssm:/your-project/${self:provider.stage}/database/host}
#   DATABASE_PORT: ${ssm:/your-project/${self:provider.stage}/database/port}
#   DATABASE_USER: ${ssm:/your-project/${self:provider.stage}/database/user}
#   DATABASE_PASSWORD: ${ssm:/your-project/${self:provider.stage}/database/password~true}
#   DATABASE_NAME: ${ssm:/your-project/${self:provider.stage}/database/name}
#   DATABASE_SSL: true
#
# Note: For production, use RDS Proxy for connection pooling:
#   DATABASE_HOST should point to RDS Proxy endpoint
#   Configure IAM authentication for enhanced security

# Disable native Serverless Framework v4 esbuild - we use serverless-esbuild plugin instead
# (configured in custom.esbuild above) for more control and custom plugin support.
build:
  esbuild: false

package:
  # Per-function packaging keeps each Lambda's unzipped artifact under the
  # 250MB cap: serverless-esbuild emits one tree-shaken bundle per handler
  # and only ships the runtime-external node_modules that handler requires
  individually: true
  patterns:
    - '!src/**/*.spec.ts'
    - '!src/**/*.test.ts'
    - '!src/**/*.d.ts'
    - '!**/*.js.map'
    # Devtime-only deps with no runtime callers — never ship them
    - '!node_modules/@graphql-codegen/**'

functions:
  main:
    handler: src/main.handler
    timeout: 29
    memorySize: 1024
    events:
      - httpApi:
          method: any
          path: /{proxy+}
      - httpApi:
          method: GET
          path: /health

  wsConnect:
    handler: src/websocket/handlers/index.connect
    timeout: 10
    memorySize: 256
    events:
      - websocket:
          route: $connect
          authorizer:
            name: wsAuthorizer
            identitySource:
              - route.request.querystring.token

  wsDisconnect:
    handler: src/websocket/handlers/index.disconnect
    timeout: 10
    memorySize: 256
    events:
      - websocket:
          route: $disconnect

  wsDefault:
    handler: src/websocket/handlers/index.defaultHandler
    timeout: 29
    memorySize: 512
    events:
      - websocket:
          route: $default

  wsAuthorizer:
    handler: src/websocket/authorizer/index.wsAuthorizer
    timeout: 10
    memorySize: 256

  # Cognito custom-auth (passwordless OTP) Lambda triggers.
  # These have no `events:` block on purpose — Cognito triggers are wired via
  # the user-pool trigger configuration (out of scope here), so they attach to
  # the pool's DefineAuthChallenge / CreateAuthChallenge /
  # VerifyAuthChallengeResponse / PreSignUp / PreTokenGeneration triggers at
  # deploy time. They are deploy-only and never imported by the running app.
  cognitoDefineAuthChallenge:
    handler: src/auth/cognito/handlers/index.defineAuthChallenge
    timeout: 10
    memorySize: 256

  cognitoCreateAuthChallenge:
    handler: src/auth/cognito/handlers/index.createAuthChallenge
    timeout: 10
    memorySize: 256

  cognitoVerifyAuthChallengeResponse:
    handler: src/auth/cognito/handlers/index.verifyAuthChallengeResponse
    timeout: 10
    memorySize: 256

  cognitoPreSignUp:
    handler: src/auth/cognito/handlers/index.preSignUp
    timeout: 10
    memorySize: 256

  cognitoPreTokenGeneration:
    handler: src/auth/cognito/handlers/index.preTokenGeneration
    timeout: 10
    memorySize: 256
