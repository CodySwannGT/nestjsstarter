services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: your-project-valkey
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - your-project-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: your-project-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: your-project
      POSTGRES_PASSWORD: your-project_local
      POSTGRES_DB: your-project
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U your-project -d your-project']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - your-project-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: your-project
    ports:
      - '3000:3000'
    environment:
      IS_OFFLINE: 'true'
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: your-project
      DATABASE_USER: your-project
      DATABASE_PASSWORD: your-project_local
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ['bun', 'run', '--watch', 'src/main-local.ts']
    networks:
      - your-project-network
    restart: unless-stopped

networks:
  your-project-network:
    driver: bridge

volumes:
  valkey_data:
    driver: local
  postgres_data:
    driver: local
